<template>
    <template lwc:if={isLoading}>
        <div class="slds-is-relative slds-p-around_large">
            <lightning-spinner alternative-text="Laster inn yrkestemaer" size="small"></lightning-spinner>
        </div>
    </template>

    <template lwc:elseif={loadError}>
        <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">{loadError}</div>
    </template>

    <template lwc:elseif={hasAvailableThemes}>
        <fieldset class="slds-form-element">
            <legend class="slds-form-element__legend slds-form-element__label">Velg yrkestemaer</legend>
            <div class="slds-form-element__control">
                <template for:each={themeCards} for:item="theme">
                    <div key={theme.value} class="slds-box slds-var-m-bottom_small">
                        <lightning-input
                            class="theme-heading"
                            type="checkbox"
                            name={theme.value}
                            label={theme.label}
                            checked={theme.checked}
                            aria-describedby={theme.descriptionId}
                            onchange={handleSelectionChange}
                        ></lightning-input>
                        <template lwc:if={theme.hasSubThemes}>
                            <ul
                                id={theme.descriptionId}
                                class="sub-themes slds-var-m-top_small"
                                aria-label="Undertemaer"
                            >
                                <template for:each={theme.subThemes} for:item="subTheme">
                                    <li key={subTheme.value} class="sub-theme">{subTheme.label}</li>
                                </template>
                            </ul>
                        </template>
                    </div>
                </template>
            </div>
        </fieldset>
    </template>

    <template lwc:else>
        <p role="status">Alle tilgjengelige yrkestemaer er allerede opprettet for dette jobbsporet.</p>
    </template>

    <template lwc:if={validationError}>
        <div class="slds-text-color_error" role="alert">{validationError}</div>
    </template>

    <div class="slds-m-top_medium slds-p-top_medium slds-border_top slds-text-align_right">
        <template lwc:if={showSelectButton}>
            <lightning-button variant="brand" label="Velg" onclick={handleNext}></lightning-button>
        </template>
        <template lwc:elseif={noThemesAvailable}>
            <lightning-button variant="brand" label="Lukk" onclick={handleNext}></lightning-button>
        </template>
    </div>
</template>
