<template>
    <template lwc:if={isLoading}>
        <div class="slds-is-relative slds-p-around_large">
            <lightning-spinner alternative-text="Laster inn yrkestemaer" size="small"></lightning-spinner>
        </div>
    </template>

    <template lwc:elseif={loadError}>
        <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">{loadError}</div>
    </template>

    <template lwc:elseif={hasAvailableThemes}>
        <p class="slds-m-bottom_medium">
            Velg ett eller flere yrkestemaer. Trykk på et valgt tema for å fjerne valget.
        </p>
        <template for:each={themeCategories} for:item="category">
            <section key={category.label} class="slds-m-bottom_medium">
                <h2 class="slds-text-heading_small slds-m-bottom_small">{category.label}</h2>
                <ul class="slds-grid slds-wrap">
                    <template for:each={category.options} for:item="theme">
                        <li key={theme.value} class="slds-m-right_small slds-m-bottom_small">
                            <button
                                type="button"
                                class={theme.buttonClass}
                                data-value={theme.value}
                                aria-pressed={theme.isSelected}
                                onclick={handleThemeToggle}
                            >
                                <template lwc:if={theme.isSelected}>
                                    <lightning-icon
                                        icon-name="utility:check"
                                        size="xx-small"
                                        variant="inverse"
                                        alternative-text="Valgt"
                                        aria-hidden="true"
                                        class="slds-m-right_x-small"
                                    ></lightning-icon>
                                </template>
                                {theme.label}
                            </button>
                        </li>
                    </template>
                </ul>
            </section>
        </template>
    </template>

    <template lwc:else>
        <p role="status">Alle tilgjengelige yrkestemaer er allerede opprettet for dette jobbsporet.</p>
    </template>

    <template lwc:if={validationError}>
        <div class="slds-text-color_error" role="alert">{validationError}</div>
    </template>

    <div class="slds-m-top_medium slds-p-top_medium slds-border_top slds-text-align_right">
        <template lwc:if={showSelectButton}>
            <lightning-button variant="brand" label="Velg" onclick={handleNext}></lightning-button>
        </template>
        <template lwc:elseif={noThemesAvailable}>
            <lightning-button variant="brand" label="Lukk" onclick={handleNext}></lightning-button>
        </template>
    </div>
</template>
