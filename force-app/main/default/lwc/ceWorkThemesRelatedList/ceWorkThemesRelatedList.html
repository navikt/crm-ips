<template>
    <template if:true={loadError}>
        <div class="slds-var-p-around_medium" role="alert">{loadError}</div>
    </template>

    <template if:true={hasRecords}>
        <lightning-datatable
            key-field="Id"
            data={records}
            columns={columns}
            hide-checkbox-column
            onrowaction={handleRowAction}
        >
        </lightning-datatable>
    </template>

    <template if:true={showEmptyState}>
        <p class="slds-var-p-around_medium">Du kan opprette det første yrkestemaet med knapp øverst på siden.</p>
    </template>
</template>
