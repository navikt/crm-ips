<template>
    <template lwc:if={isLoading}>
        <div class="slds-is-relative slds-p-around_large">
            <lightning-spinner alternative-text="Laster yrkestemaer" size="small"></lightning-spinner>
        </div>
    </template>

    <template lwc:elseif={loadError}>
        <div class="slds-notify slds-notify_alert slds-alert_error" role="alert" data-id="load-error">
            <p>{loadError}</p>
        </div>
    </template>

    <template lwc:elseif={hasNoThemes}>
        <div class="slds-notify slds-notify_alert slds-alert_warning" role="alert" data-id="no-themes">
            <div>
                <p class="slds-text-heading_small">Jobbsporet har ingen registrerte yrkestemaer</p>
                <p>Du må registrere et yrkestema på jobbsporet før du kan opprette en mulighet.</p>
            </div>
        </div>
    </template>

    <template lwc:elseif={showForm}>
        <template lwc:if={showServerError}>
            <div
                class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_small"
                role="alert"
                data-id="server-error"
            >
                <p>{errorMessage}</p>
            </div>
        </template>

        <lightning-combobox
            data-id="theme"
            name="theme"
            label="Yrkestema"
            placeholder="Velg et registrert yrkestema"
            options={themeOptions}
            value={selectedThemeId}
            required
            message-when-value-missing="Velg et yrkestema."
            onchange={handleThemeChange}
        ></lightning-combobox>

        <template lwc:if={hasSelectedTheme}>
            <lightning-input
                class="slds-m-top_small"
                data-id="name"
                name="opportunityName"
                label="Navn på muligheten"
                value={nameValue}
                max-length={nameMaxLength}
                required
                message-when-value-missing="Skriv inn navn på muligheten."
                onchange={handleNameChange}
            ></lightning-input>

            <lightning-textarea
                class="slds-m-top_small"
                data-id="description"
                name="description"
                label="Beskrivelse"
                value={descriptionValue}
                max-length={textMaxLength}
                onchange={handleDescriptionChange}
            ></lightning-textarea>

            <lightning-record-picker
                class="slds-m-top_small"
                data-id="account"
                label="Arbeidsgiver"
                placeholder="Søk etter arbeidsgiver"
                object-api-name="Account"
                value={accountValue}
                required
                onchange={handleAccountChange}
            ></lightning-record-picker>
        </template>
    </template>
</template>
