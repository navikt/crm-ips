name: "[HELPER] Promote Package"
on:
  workflow_dispatch:
    inputs:
      packageId:
        description: "Package ID"
        required: true
      comment:
        description: "Release Comment"
        required: true

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  debug:
    name: Debug Information
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Print input values
        run: |
          echo "Promoting Package ID: ${{ github.event.inputs.packageId }}"
          echo "Initiator: ${{ github.actor }}"

  run-package-promotion:
    name: Promote Package
    uses: navikt/crm-workflows-base/.github/workflows/packagePromotion.yml@aad6b4f48e419d71490db436da697cd7581a2c6a
    permissions:
      contents: write
      pull-requests: write
    with:
      packageId: ${{ inputs.packageId }}
      comment: ${{ inputs.comment }}
    secrets: inherit