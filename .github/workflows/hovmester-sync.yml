name: Sync hovmester
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    uses: navikt/hovmester/.github/workflows/hovmester-sync.yml@4aed3abbcff3b3e3912a65da130368b024b0f838 # main
    with:
      collections: "backend, frontend"              # eller "backend", "backend,frontend"
