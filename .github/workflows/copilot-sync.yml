name: Copilot Customization Sync
on:
  schedule:
    - cron: '0 7 * * 1'  # Weekly on Mondays at 07:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true
jobs:
  sync:
    uses: navikt/copilot/.github/workflows/copilot-customization-sync.yml@d66b80238746c42e560f560c242aae55dde68860 # main v0.15.0
    permissions:
      contents: write
      pull-requests: write
