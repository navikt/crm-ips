name: "[HELPER] Deploy to Production"
on:
  workflow_dispatch:
    inputs:
      packageId:
        description: "Package ID"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  deploy-to-production:
    name: Deploy to Production
    uses: navikt/crm-workflows-base/.github/workflows/deployPackage.yml@aad6b4f48e419d71490db436da697cd7581a2c6a
    permissions:
      contents: read
    with:
      packageId: ${{ inputs.packageId }}
      org: prod
      unpackagable: ./force-app/unpackagable-with-auto-deploy
    secrets: inherit