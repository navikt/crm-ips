name: "[HELPER] Deployment"
on:
  workflow_dispatch:
    inputs:
      packageId:
        description: "Package ID"
        required: true
        type: string
      org:
        description: "Org (preprod, dev, uat, sit)"
        required: true
        type: choice
        options:
        - preprod
        - sit
        - crm-uat
        - uat
        - dev

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  debug:
    name: Debug Information
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Print input values
        run: |
          echo "Org: ${{ inputs.org }}"
          echo "Package ID: ${{ inputs.packageId }}"
          echo "Initiator: ${{ github.actor }}"

  deploy-package:
    name: Deploy Package
    uses: navikt/crm-workflows-base/.github/workflows/deployPackage.yml@b2a868d2ab462a8f6708a889e1f6ecb779e68199 # master
    permissions:
      contents: read
    with:
      packageId: ${{ inputs.packageId }}
      org: ${{ inputs.org }}
      unpackagable: ./force-app/unpackagable-with-auto-deploy
    secrets: inherit