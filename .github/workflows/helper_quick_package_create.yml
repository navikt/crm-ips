name: "[HELPER] Quick Package Create"
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  debug:
    name: Debug Information
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Print values
        run: |
          echo running on branch ${GITHUB_REF##*/}
          echo "Initiator: ${{ github.actor }}"

  quick-package-create:
    name: Quick Create Package
    uses: navikt/crm-workflows-base/.github/workflows/quickPackageCreate.yml@aad6b4f48e419d71490db436da697cd7581a2c6a
    permissions:
      contents: write
    secrets: inherit
